<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스네이크 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="header">
      <h1 class="title">SNAKE</h1>
      <!-- 소리 켜기/끄기 -->
      <button id="sound-btn" class="sound-btn" type="button" title="소리 켜기/끄기">🔊</button>
    </header>

    <!-- 점수 표시 -->
    <div class="scores">
      <div class="score-box">
        <span class="label">점수</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-box">
        <span class="label">최고 점수</span>
        <strong id="best">0</strong>
      </div>
      <div class="score-box">
        <span class="label">레벨</span>
        <strong id="level">1</strong>
      </div>
    </div>

    <!-- 난이도 선택 -->
    <div class="difficulty">
      <label for="difficulty">난이도</label>
      <select id="difficulty">
        <option value="easy">쉬움 (200ms)</option>
        <option value="normal" selected>보통 (150ms)</option>
        <option value="hard">어려움 (100ms)</option>
        <option value="extreme">매우 어려움 (50ms)</option>
      </select>
    </div>

    <!-- 게임 화면 -->
    <div class="board">
      <canvas id="canvas" width="400" height="400"></canvas>

      <!-- 게임 오버 안내 -->
      <div id="game-over" class="game-over hidden">
        <p>GAME OVER</p>
        <button id="restart-btn" class="btn">다시 시작</button>
      </div>
    </div>

    <div class="buttons">
      <button id="start-btn" class="btn">게임 시작</button>
      <button id="pause-btn" class="btn btn-sub" disabled>일시정지</button>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
